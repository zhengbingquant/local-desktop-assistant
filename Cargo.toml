[package]
name = "luma"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Local-first terminal coding assistant"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
ctrlc = "3"
dunce = "1"
globset = "0.4"
ignore = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
scraper = "0.24"
serde_json = "1"
sha2 = "0.10"
similar = "2"
tempfile = "3"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_UI_WindowsAndMessaging"] }
